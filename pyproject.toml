[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "season-model"
version = "0.1.0"
description = "zerozero.pt data pipeline and Monte Carlo season model for amateur football leagues, notebook-first"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

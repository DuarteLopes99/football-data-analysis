[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-data-analysis"
version = "0.1.0"
description = "Football data analysis on zerozero.pt league data: a generic season data core and one package per analysis, notebook-first"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
